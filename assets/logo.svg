<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="stripcomments logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="broom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="40" fill="url(#bg)"/>

  <!-- garbage // comment lines being swept away -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" font-size="13">
    <text x="28" y="46" fill="#ffffff" opacity="0.9">// TODO fix later</text>
    <text x="40" y="70" fill="#ffffff" opacity="0.6">// does the thing</text>
    <text x="60" y="92" fill="#ffffff" opacity="0.35">// obviously</text>
  </g>

  <!-- dust particles -->
  <g fill="#ffffff">
    <circle cx="150" cy="58" r="3" opacity="0.5"/>
    <circle cx="164" cy="74" r="2.2" opacity="0.4"/>
    <circle cx="142" cy="42" r="2" opacity="0.35"/>
  </g>

  <!-- broom -->
  <g transform="rotate(35 100 128)">
    <rect x="94" y="38" width="9" height="78" rx="4" fill="#78350f"/>
    <path d="M78 114 h42 l14 40 q-35 12 -70 0 z" fill="url(#broom)"/>
    <path d="M82 148 l4 12 M92 152 l2 12 M100 153 l0 13 M108 152 l-2 12 M116 148 l-4 12"
