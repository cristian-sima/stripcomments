<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="stripcomments logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="broom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="40" fill="url(#bg)"/>

  <!-- comment slashes being swept away -->
  <g fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">
    <text x="44" y="86" font-size="58" opacity="0.28">//</text>
    <text x="96" y="70" font-size="34" opacity="0.18">//</text>
    <text x="132" y="52" font-size="22" opacity="0.10">/</text>
  </g>

  <!-- dust particles -->
  <g fill="#ffffff">
    <circle cx="150" cy="60" r="3" opacity="0.5"/>
    <circle cx="162" cy="76" r="2.2" opacity="0.4"/>
    <circle cx="140" cy="44" r="2" opacity="0.35"/>
  </g>

  <!-- broom -->
  <g transform="rotate(35 100 130)">
    <rect x="94" y="40" width="9" height="78" rx="4" fill="#78350f"/>
    <path d="M78 116 h42 l14 40 q-35 12 -70 0 z" fill="url(#broom)"/>
    <path d="M82 150 l4 12 M92 154 l2 12 M100 155 l0 13 M108 154 l-2 12 M116 150 l-4 12"
          stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- preserved directive line, kept clean -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">
    <text x="30" y="168" font-size="17" fill="#a7f3d0">//go:</text>
    <text x="79" y="168" font-size="17" fill="#ffffff">embed</text>
  </g>
</svg>
